[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wepack"
version = "1.0.0"
description = "ExeOnMac: 把 Windows 安装包封装成可双击运行的 macOS .app"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wepack = "wepack.cli:main"

[tool.setuptools]
packages = [
    "wepack",
    "wepack.detect",
    "wepack.extract",
    "wepack.prefix",
    "wepack.install",
    "wepack.package",
    "wepack.layers",
    "wepack.recipes",
]